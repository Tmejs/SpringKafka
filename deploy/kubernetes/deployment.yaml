apiVersion: apps/v1
kind: Deployment
metadata:
  name: fund-orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fund-orders
  template:
    metadata:
      labels:
        app: fund-orders
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: fund-orders
          image: registry.example.com/fund-orders:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: fund-orders-config
                  key: kafkaBootstrapServers
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: fund-orders-config
                  key: datasourceUrl
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fund-orders-secrets
                  key: datasourceUsername
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fund-orders-secrets
                  key: datasourcePassword
            - name: APP_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fund-orders-secrets
                  key: basicUsername
            - name: APP_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fund-orders-secrets
                  key: basicPassword
            - name: APP_KAFKA_TOPIC
              value: fund-order-events
            - name: APP_KAFKA_DLQ_TOPIC
              value: fund-order-events.DLQ
            - name: APP_KAFKA_PARTITIONS
              value: "3"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fund-orders
spec:
  type: ClusterIP
  selector:
    app: fund-orders
  ports:
    - name: http
      port: 80
      targetPort: http
