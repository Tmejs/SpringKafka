openapi: 3.0.3
info:
  title: Fund Order Event API
  version: 0.1.0
  description: Fictional investment-fund order status event demonstration.
servers:
  - url: http://localhost:8080
security:
  - basicAuth: []
paths:
  /api/v1/fund-order-events:
    post:
      summary: Validate and publish a typed event
      description: Returns 202 after Kafka acknowledges the record. Consumption happens later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundOrderStatusEvent'
      responses:
        '202':
          description: Kafka acknowledged the event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishReceipt'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/KafkaUnavailable'
    get:
      summary: List consumed events
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Events ordered by occurredAt descending, then eventId descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/fund-order-events/raw:
    post:
      summary: Publish raw text to test consumer validation
      description: Sends the body unchanged, including malformed JSON. Maximum 64 KiB of request body bytes.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '202':
          description: Kafka acknowledged the raw text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishReceipt'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Raw request body exceeds 64 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/KafkaUnavailable'
  /api/v1/fund-order-events/{eventId}:
    get:
      summary: Get one consumed event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Persisted event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessedFundOrderEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Event does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /actuator/health:
    get:
      summary: Public aggregate health
      security: []
      responses:
        '200':
          description: Healthy
  /actuator/health/liveness:
    get:
      summary: Public liveness probe
      security: []
      responses:
        '200':
          description: Live
  /actuator/health/readiness:
    get:
      summary: Public readiness probe including PostgreSQL
      security: []
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  responses:
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Basic authentication required
    KafkaUnavailable:
      description: Kafka did not acknowledge the record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    FundOrderStatusEvent:
      type: object
      required: [schemaVersion, eventId, orderId, partnerCode, fundIsin, status, occurredAt]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        eventId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        partnerCode:
          type: string
          pattern: '^[A-Z0-9_]{2,32}$'
        fundIsin:
          type: string
          pattern: '^[A-Z]{2}[A-Z0-9]{10}$'
        status:
          type: string
          enum: [ACCEPTED, REJECTED, EXECUTED]
        occurredAt:
          type: string
          format: date-time
    ProcessedFundOrderEvent:
      allOf:
        - $ref: '#/components/schemas/FundOrderStatusEvent'
        - type: object
          required: [processedAt]
          properties:
            processedAt:
              type: string
              format: date-time
    EventPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProcessedFundOrderEvent'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
    PublishReceipt:
      type: object
      required: [topic, partition, offset, key]
      properties:
        topic:
          type: string
        partition:
          type: integer
        offset:
          type: integer
          format: int64
        key:
          type: string
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
