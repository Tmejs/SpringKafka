services:
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fund_orders
      POSTGRES_USER: fund_orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fund_orders -d fund_orders"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fund_orders
      SPRING_DATASOURCE_USERNAME: fund_orders
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_BASIC_AUTH_USERNAME: ${APP_BASIC_AUTH_USERNAME:?Set APP_BASIC_AUTH_USERNAME in .env}
      APP_BASIC_AUTH_PASSWORD: ${APP_BASIC_AUTH_PASSWORD:?Set APP_BASIC_AUTH_PASSWORD in .env}
      APP_KAFKA_TOPIC: ${APP_KAFKA_TOPIC:-fund-order-events}
      APP_KAFKA_DLQ_TOPIC: ${APP_KAFKA_DLQ_TOPIC:-fund-order-events.DLQ}
      APP_KAFKA_PARTITIONS: ${APP_KAFKA_PARTITIONS:-3}
      APP_KAFKA_MAX_POLL_RECORDS: ${APP_KAFKA_MAX_POLL_RECORDS:-100}
      APP_KAFKA_CONCURRENCY: ${APP_KAFKA_CONCURRENCY:-1}
      APP_KAFKA_RETRY_DELAY: ${APP_KAFKA_RETRY_DELAY:-1s}
      APP_KAFKA_SEND_TIMEOUT: ${APP_KAFKA_SEND_TIMEOUT:-5s}
      APP_KAFKA_DLQ_SEND_TIMEOUT: ${APP_KAFKA_DLQ_SEND_TIMEOUT:-10s}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
